syntax = "proto3";
option csharp_namespace = "BograczApi";

package products;

service ProductService {
  rpc AddProduct (ProductRequest) returns (ProductReply);
  rpc GetProduct (ProductLookup) returns (ProductReply);
  rpc DeleteProduct (ProductLookup) returns (Empty);
}

message ProductRequest {
  string name = 1;
  double price = 2;
}

message ProductLookup {
  int32 id = 1;
}

message ProductReply {
  int32 id = 1;
  string name = 2;
  double price = 3;
}

message Empty {}
